name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  # `id-token: write` is required for npm trusted publishing. The npm
  # CLI exchanges a GitHub OIDC token for a short-lived publish token
  # at registry-time, so no NPM_TOKEN secret is needed.
  #
  # Configure the npm side at:
  #   https://www.npmjs.com/package/@milespossing/pi-copilot-discovery/access
  # → "Trusted Publishers" → add this repo + workflow.
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm to a trusted-publisher-capable version
        # Trusted publishing requires npm >= 11.5.1; node 22 ships with
        # npm 10.x. Pin to `latest` rather than a specific version so we
        # pick up future fixes automatically — this only runs in CI, so
        # version drift here is low-risk.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const expected = `v${pkg.version}`;
          if (tag !== expected) {
            console.error(`Tag ${tag} does not match package.json version ${expected}`);
            process.exit(1);
          }
          '

      - name: Verify published contents
        run: npm pack --dry-run

      - name: Publish package
        # No NODE_AUTH_TOKEN: trusted publishing uses the OIDC token
        # exchanged from `id-token: write`. Provenance is generated
        # automatically by trusted publishers; the explicit flag is
        # redundant but kept for clarity.
        run: npm publish --access public --provenance
